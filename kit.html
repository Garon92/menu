<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>g92 kit – průvodce stylem</title>
    <meta name="description" content="Design systém garon92: tokeny, komponenty a herní obrazovky." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/menu/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('g92:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body class="g92-app kitguide">
    <g92-appbar app="menu" heading="g92 kit" back="./" back-label="Menu" fullscreen help no-activity></g92-appbar>
    <main class="g92-main" id="guide"></main>
    <script type="module" src="/src/kitguide.ts"></script>
  </body>
</html>
