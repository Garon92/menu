<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Garon92 – hry a učení</title>
    <meta name="description" content="Rozcestník her a procvičování: matematika, čeština, angličtina, tanky, ryby, komáři, spojovačka a dots." />
    <link rel="icon" href="/menu/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/menu/apple-touch-icon.png" />
    <script>
      // apply saved theme before first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem('g92:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body class="g92-app menu">
    <div class="menu-bg" aria-hidden="true"></div>
    <g92-appbar app="menu" heading="Menu"></g92-appbar>
    <main class="g92-main menu-main" id="main">
      <noscript><p class="g92-card">Pro spuštění je potřeba zapnout JavaScript.</p></noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
