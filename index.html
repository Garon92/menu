<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Moje projekty – Garon92</title>
    <meta name="description" content="Hry, učení, tvoření, weby a Letadlo pro Android. Přehled projektů Garon92 na jednom místě." />
    <link rel="icon" href="/menu/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/menu/apple-touch-icon.png" />
    <script>
      // apply saved theme before first paint (no flash)
      try {
        var s = JSON.parse(localStorage.getItem('g92:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
  </head>
  <body class="g92-app menu">
    <a class="skip-link" href="#projects">Přejít na projekty</a>
    <main class="menu-main" id="main">
      <noscript><p class="g92-card">Pro spuštění je potřeba zapnout JavaScript.</p></noscript>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
